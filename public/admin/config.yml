backend:
  name: github
  repo: YOUR_GITHUB_USERNAME/YOUR_REPOSITORY
  branch: main
local_backend: true
locale: zh_Hans
media_folder: public/uploads
public_folder: /uploads
collections:
  - name: posts
    label: 日常手记
    folder: src/content/posts
    create: true
    slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
    fields:
      - {label: 标题, name: title, widget: string}
      - {label: 摘要, name: description, widget: text}
      - {label: 日期, name: date, widget: datetime, date_format: YYYY-MM-DD, time_format: false, format: YYYY-MM-DD}
      - {label: 分类, name: category, widget: select, options: [生活, 随想, 阅读, 旅行]}
      - {label: 草稿, name: draft, widget: boolean, default: false}
      - {label: 正文, name: body, widget: markdown}
  - name: settings
    label: 个人介绍
    files:
      - label: 网站与个人资料
        name: profile
        file: src/data/profile.json
        fields:
          - {label: 站名, name: name, widget: string}
          - {label: 首页标题, name: intro, widget: text}
          - {label: 简介, name: bio, widget: text}
          - {label: 关于我, name: about, widget: text}
          - {label: 头像, name: avatar, widget: image, required: false, hint: "建议上传正方形照片；当前照片已针对脸部取景。"}
